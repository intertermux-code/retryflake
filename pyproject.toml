[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "retryflake"
version = "0.1.0"
description = "Run flaky commands with retries, exponential backoff, jitter, and timeouts"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AP", email = "intertermux@gmail.com" }]
keywords = ["retry", "backoff", "jitter", "cli", "reliability", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/intertermux-code/retryflake"
Issues = "https://github.com/intertermux-code/retryflake/issues"

[project.scripts]
retryflake = "retryflake:main"

[tool.setuptools.packages.find]
where = ["src"]
